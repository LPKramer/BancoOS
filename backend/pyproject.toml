[project]
name = "osanalise"
version = "0.1.0"
description = "Análise de OS erradas (regras do Banco de Análise + LLM) e correção assistida no TS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "access-parser==0.0.6",
    "tabulate>=0.9",
    "openai>=1.40",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
robo = ["java-access-bridge-wrapper>=1.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["osanalise*"]

[tool.setuptools.package-data]
osanalise = ["recursos/*.json", "recursos/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
